name: Docs

# The documentation checks that used to be done by hand, and were therefore
# done only when someone remembered. See scripts/docs-check.mjs for why each
# check exists — every one of them corresponds to a real mistake found on
# 7 Aug 2026.
#
# ⚠️ THIS COMMENT USED TO SAY THE OPPOSITE, AND IT WAS WRONG. It read:
# "`[skip ci]` in a commit message suppresses the NETLIFY build (a deploy), not
# this workflow". It suppresses BOTH. GitHub Actions matches `[skip ci]` on the
# HEAD commit for `push` and `pull_request` alike, so a docs-only commit written
# to the old `CLAUDE.md` rule 3 skipped the very workflow that exists to check
# docs-only commits — and, once this became a REQUIRED check on 10 Aug 2026,
# left the pull request permanently unmergeable.
#
# Nothing in the run history could have caught it: every `[skip ci]` commit in
# this repo predates these workflows, which were created on 10 Aug 2026.
#
# `[skip ci]` is now banned outright. Skipping a needless DEPLOY is
# `scripts/netlify-ignore.mjs`, wired as `ignore` in `netlify.toml`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # REQUIRED. The changelog coverage check walks history back to a
          # baseline commit; a shallow clone cannot see it and the check
          # reports itself as skipped rather than passing silently.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # No `npm ci` on purpose: docs-check has zero dependencies and reads only
      # the filesystem and `git`. Installing would make a docs check depend on
      # the lockfile resolving, which is an unrelated way to fail.
      - name: Check documentation integrity
        run: node scripts/docs-check.mjs
