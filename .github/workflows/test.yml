name: Tests

# The unit suite, which until now ran only on somebody's laptop.
#
# ⚠️ WHY THIS MATTERS MORE HERE THAN IT WOULD ON AN ORDINARY REPO: `main` is the
# production branch and Netlify deploys it on push (CLAUDE.md rule 3). Netlify's
# build command is `npm run build`, so a COMPILE error already blocks a deploy —
# but a failing TEST did not, and nothing anywhere was checking. A commit that
# broke the session guard, an RLS-facing data helper or `safeNext()` would have
# gone green to a live site parents use. This workflow is the gate for that.
#
# Deliberately a separate workflow from docs.yml rather than a second job in it:
# a docs-only commit should not wait on vitest, and a red suite should not
# present itself as "docs failed".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # ⚠️ REQUIRED, AND PLACEHOLDERS ON PURPOSE.
    #
    # src/lib/supabase.js throws at IMPORT TIME when either of these is missing.
    # Without them ten test files do not fail an assertion, they fail to COLLECT
    # — "Missing required Supabase env var(s)" — and a reader of that log would
    # reasonably conclude the suite is broken rather than unconfigured.
    #
    # Placeholders because `npm test` never reaches the network: the integration
    # suite is a separate vitest mode (`npm run test:integration`, see
    # vite.config.js) and is not run here. So no real value is needed — and none
    # should be added, because this repo is public. CLAUDE.md rule 2.
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # ⚠️ --include=dev. Vitest is a devDependency, and an npm that believes
      # NODE_ENV is production omits those silently — with a symptom
      # ("'vite' is not recognized") that points nowhere near the cause. The
      # same trap is documented in CLAUDE.md for the dev machines.
      - run: npm ci --include=dev

      # ⚠️ BEFORE the tests, and not optional. tests/press-feedback.test.js
      # inspects the BUILT stylesheet in dist/assets/ — it asserts on the CSS
      # that actually ships rather than on the Tailwind source, which is the
      # entire point of it. With no build it fails five assertions, each saying
      # "run `npm run build` first".
      #
      # It also means a build failure is caught here rather than only by
      # Netlify, which for a pull request is the difference between finding out
      # now and finding out after merge.
      - run: npm run build

      - run: npm test

      # ── Dependency advisories ────────────────────────────────────────────
      #
      # ⚠️ THIS IS A STEP OF THE `test` JOB ON PURPOSE, NOT ITS OWN WORKFLOW.
      # `test` and `docs-check` are the two REQUIRED checks on this repo; a new
      # workflow would produce a new check name that gates nothing until
      # somebody edits branch protection, and a gate that does not gate is the
      # "check nobody runs" this repo has been bitten by before. Living here, it
      # blocks a merge from the moment it lands.
      #
      # ⚠️ LAST, so a genuine test failure is never masked by it — and because
      # `npm audit` talks to the registry, so it is the one step here that can
      # fail for reasons that have nothing to do with the code.
      #
      # ⚠️ `--omit=dev` IS THE WHOLE DESIGN, AND IT IS A JUDGEMENT WORTH STATING.
      # Measured 15 Aug 2026: the full tree carries 10 advisories — 5 moderate,
      # 4 high, 1 CRITICAL — and eight of them, including the critical (vitest),
      # are devDependencies. None of those ship. `dist/` is what a parent's
      # phone downloads, and it contains no vitest, no vite, no esbuild. Gating
      # on the full tree would mean a critical in a test runner blocking a fix
      # to the live site, which is the wrong way round.
      #
      # ⚠️ AND `--audit-level=high` RATHER THAN `moderate` BECAUSE THE TWO
      # PRODUCTION ADVISORIES TODAY ARE MODERATE AND HAVE NO NON-BREAKING FIX.
      # Both are react-router, and the only version without them is v7 — a
      # major, i.e. a migration. Gating at `moderate` would red every build in
      # this repo from the day it merged, until an unrelated framework upgrade
      # happened. A permanently red gate teaches people to ignore the gate.
      # The reasoning for why they are not exploitable here is in
      # claude/open-items.md; when react-router 7 lands, drop this to moderate.
      - name: Audit what actually ships
        run: npm audit --omit=dev --audit-level=high

      # The rest of the picture, reported and never gating. Dev advisories are
      # worth SEEING — a compromised test runner still runs on a maintainer's
      # laptop with their credentials — they are just not worth blocking a
      # release for. `|| true` so this can only ever inform.
      - name: Report every advisory, including dev (never fails)
        run: npm audit || true
